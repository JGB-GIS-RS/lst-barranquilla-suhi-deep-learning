name: One-time traceability cleanup

on:
  push:
    paths:
      - '.github/workflows/traceability_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Align notebook traceability notes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks_08 = [
              Path('notebooks/08A_train_M1_unet_baseline.ipynb'),
              Path('notebooks/08B_train_M2_se_unet.ipynb'),
              Path('notebooks/08C_train_M3_convlstm_unet_v5_2016_2025_dirfix.ipynb'),
              Path('notebooks/08D_train_M4_convlstm_se_unet.ipynb'),
          ]

          old = 'El modelo Final usa `M6A_direct_T3_spectral_delta_ssrd_delta_precip` con 20 canales: 18 espectrales + 2 climáticos.'
          new = 'M5 corresponde al modelo final reportado: `T3-Climate ConvLSTM-SE U-Net`, con 18 canales espectrales T3 y dos descriptores climático-radiativos regionales (ΔT2M y Δradiación solar).'

          for path in notebooks_08:
              raw = path.read_text(encoding='utf-8')
              count = raw.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one obsolete M6A header reference; found {count}.')
              path.write_text(raw.replace(old, new, 1), encoding='utf-8')
              print('Updated:', path)

          path = Path('notebooks/07_patch_extraction.ipynb')
          raw = path.read_text(encoding='utf-8')
          marker = '### Reference-experiment traceability'
          if marker not in raw:
              sentence = 'The patches generated here correspond to the final climate-augmented model. The spectral-only models M1–M4 use spectral-only T3 patches. This separation avoids conflating architecture effects with climate-augmentation effects.\n'
              needle = json.dumps(sentence, ensure_ascii=False)
              idx = raw.find(needle)
              if idx < 0:
                  raise RuntimeError('Notebook 07: expected introductory traceability sentence not found.')
              insert_at = idx + len(needle)
              extra_lines = [
                  '\n',
                  '### Reference-experiment traceability\n',
                  '\n',
                  'Notebook 06→07 is the public reconstruction of the logical and tensor contract used by the reported experiment: T3 temporal ordering, predictor-channel content, target-year split, patch geometry, and validity rules. The large historical patch arrays used in the reference M1–M5 runs are not stored in GitHub, and this public reconstruction is not asserted to reproduce those binary NPZ artifacts byte for byte.\n',
                  '\n',
                  'Training notebooks 08A–08D consume the archived reference-experiment product `T3_full` (18 spectral channels). Notebook 08E consumes the archived product `T3_full_M5B_delta_t2m_delta_radiation` (20 channels: the same 18 spectral T3 channels plus the two selected climate-radiative descriptors). These historical product names are retained as provenance identifiers for the runs reported in the manuscript.\n',
                  '\n',
                  'Accordingly, the Notebook 06→07 chain should be interpreted as a reproducible reconstruction of the data contract and processing logic, not as evidence that newly generated patch files are the identical binary artifacts used in the historical training runs.\n',
              ]
              addition = ',' + ','.join(json.dumps(line, ensure_ascii=False) for line in extra_lines)
              raw = raw[:insert_at] + addition + raw[insert_at:]
              path.write_text(raw, encoding='utf-8')
              print('Updated:', path)
          else:
              print('Notebook 07 traceability note already present; no change required.')
          PY

      - name: Commit notebook documentation changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            notebooks/07_patch_extraction.ipynb \
            notebooks/08A_train_M1_unet_baseline.ipynb \
            notebooks/08B_train_M2_se_unet.ipynb \
            notebooks/08C_train_M3_convlstm_unet_v5_2016_2025_dirfix.ipynb \
            notebooks/08D_train_M4_convlstm_se_unet.ipynb
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: align notebook provenance with reference experiment'
          git push
