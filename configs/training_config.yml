# Training configuration for the Barranquilla LST/SUHI workflow.

training:
  task: "spatial_temporal_regression"
  loss_function: "mean_squared_error"
  masked_loss: true
  optimizer: "adam"
  learning_rate: null
  batch_size: null
  epochs: null
  early_stopping: true
  early_stopping_patience: null
  reduce_lr_on_plateau: true
  reduce_lr_patience: null
  minimum_learning_rate: null

temporal_formulation:
  input_states:
    - label: "T1"
      year_offset: -3
      description: "Antecedent state Y-3"
    - label: "T2"
      year_offset: -2
      description: "Antecedent state Y-2"
    - label: "T3"
      year_offset: -1
      description: "Antecedent state Y-1"
  target:
    label: "Y"
    variable: "LST"
    description: "Land surface temperature at target year Y"
    target_year_lst_as_input: false

data_partitioning:
  strategy: "temporal_holdout"
  normalization_train_period: "2013-2019"
  target_train_years:
    - 2016
    - 2017
    - 2018
    - 2019
  target_validation_years:
    - 2020
    - 2021
    - 2022
  target_test_years:
    - 2023
    - 2024
    - 2025
  temporal_holdout: true
  spatial_holdout: "structured_blocks_when_applicable"
  random_patch_split: false
  description: "Training, validation, and test partitions are separated by target year to reduce temporal leakage."

normalization:
  spectral_indices: "train_only_robust_min_max"
  lst: "train_only_global_z_score"
  climate_forcings: "train_only_standardization_when_required"
  leakage_control:
    normalization_parameters_from_training_only: true
    validation_data_used_for_normalization: false
    test_data_used_for_normalization: false

input_control:
  allowed_input_groups:
    - "landsat_spectral_indices"
    - "observation_quality_mask"
    - "interannual_climate_forcings"
  prohibited_input_variables:
    - "observed_LST_target_year"
    - "predicted_LST_previous_models"
    - "future_spectral_indices"
  climate_forcings_use_observed_target_lst: false

climate_forcings:
  source: "NASA POWER Daily API"
  candidate_variables_evaluated: true
  retained_variables:
    - "delta_t2m_mean_Y_minus_Yminus1"
    - "delta_solar_radiation_mean_Y_minus_Yminus1"
  note: "Retained variables must be interpreted as annual regional interannual context, not as pixel-level forcings."

evaluation:
  metrics:
    - "RMSE"
    - "MAE"
    - "R2"
    - "bias"
    - "residual_standard_deviation"
  diagnostics:
    - "year_wise_metrics"
    - "observed_vs_predicted_maps"
    - "residual_maps"
    - "spatial_error_patterns"
  report_units: "degrees Celsius after inverse transformation"

model_comparison:
  same_partitions_across_models: true
  same_normalization_across_models: true
  same_masking_across_models: true
  same_evaluation_metrics_across_models: true

hardware:
  gpu: null
  environment: null
  runtime: null

notes:
  - "Random patch-level splitting can inflate performance due to spatial autocorrelation."
  - "Evaluation metrics should be reported in physical LST units after inverse transformation when normalized LST is used during training."
  - "Final hyperparameters should be filled after the executed training workflow is fixed."
