# Training configuration reference for the Barranquilla LST/SUHI workflow.
# This file is a reference record; executed notebooks are authoritative.

configuration_role:
  type: "reference_record"
  runtime_authoritative: false
  authoritative_source:
    - "notebooks/08A_train_M1_unet_baseline.ipynb"
    - "notebooks/08B_train_M2_se_unet.ipynb"
    - "notebooks/08C_train_M3_convlstm_unet_v5_2016_2025_dirfix.ipynb"
    - "notebooks/08D_train_M4_convlstm_se_unet.ipynb"
    - "notebooks/08E_train_M5_t3_climate_convlstm_se_unet.ipynb"

task:
  name: "supervised_spatiotemporal_regression"
  target: "Annual Landsat-derived LST at target year Y"
  target_training_scale: "Fixed reference-period z-score"
  physical_reporting_units: "degrees Celsius"
  temporal_formulation: "Y-3, Y-2, Y-1 -> LST(Y)"

data_partitioning:
  strategy: "Target-year temporal holdout"
  assignment_stage: "Before patch extraction"
  training_target_years: [2016, 2017, 2018, 2019]
  validation_target_years: [2020, 2021, 2022]
  test_target_years: [2023, 2024, 2025]
  random_patch_split: false
  independent_spatial_block_holdout: false
  interpretation: "Temporally controlled retrospective evaluation over a shared geographic domain."

patch_reference:
  patch_height_pixels: 128
  patch_width_pixels: 128
  training_stride_pixels: 64
  validation_stride_pixels: 128
  test_stride_pixels: 128
  minimum_valid_pixel_fraction: 0.70
  training_overlap: true
  validation_overlap: false
  test_overlap: false
  validity_mask_role: "Exclude invalid, water, non-land, and unavailable pixels from loss and metric calculations."
  validity_mask_used_as_predictor: false
  archive_note: "Training notebooks consume archived external patch datasets from the reference experiment; large patch archives are not stored in GitHub."

normalization:
  landsat:
    strategy: "Fixed pre-validation reference-period parameter estimation"
    reference_years: [2013, 2014, 2015, 2016, 2017, 2018, 2019]
    validation_years_used_for_parameter_estimation: false
    test_years_used_for_parameter_estimation: false
    lst:
      method: "Global z-score"
      mean_c: 38.48322677612305
      std_c: 4.032179355621338
      n_reference_values: 4301427
    spectral_indices:
      method: "Robust percentile-based min-max scaling"
      variables: ["NDVI", "NDMI", "NDBI", "UI", "SAVI", "BSI"]
      p_low: 2
      p_high: 98
      clip_output_to_0_1: true
  climate_radiative_descriptors:
    strategy: "Target-TRAIN-only standardization"
    parameter_years: [2016, 2017, 2018, 2019]
  historical_label_note: "Historical notebook and directory names retain train_only terminology; for Landsat variables the executed reference experiment used the 2013-2019 pre-validation period."

input_control:
  M1_to_M4:
    allowed_predictors:
      - "Three antecedent annual states of NDVI, NDMI, NDBI, UI, SAVI, and BSI"
  M5:
    allowed_predictors:
      - "Three antecedent annual states of NDVI, NDMI, NDBI, UI, SAVI, and BSI"
      - "delta_t2m_mean_Y_minus_Yminus1"
      - "delta_solar_radiation_mean_Y_minus_Yminus1"
  prohibited_predictors:
    - "Observed target-year LST"
    - "Antecedent LST maps"
    - "Predictions from previous models"
    - "Model residuals"
  climate_radiative_spatial_support: "Annual regional descriptors for the model-domain centroid"
  climate_radiative_pixel_level_fields: false

optimization:
  optimizer: "AdamW"
  initial_learning_rate: 0.001
  weight_decay: 0.00001
  loss:
    name: "Masked Huber loss"
    delta: 1.0
    valid_pixels_only: true
  gradient_clipping:
    enabled: true
    maximum_norm: 1.0
  learning_rate_scheduler:
    name: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.5
    patience_epochs: 5
    monitored_quantity: "Validation loss"
  checkpointing:
    criterion: "Minimum validation loss"
    test_used_for_selection: false

model_specific_training:
  M1: {batch_size: 4, maximum_epochs: 100, early_stopping_patience_epochs: 15, random_seed: 42}
  M2: {batch_size: 4, maximum_epochs: 100, early_stopping_patience_epochs: 15, random_seed: 42}
  M3: {batch_size: 4, maximum_epochs: 100, early_stopping_patience_epochs: 15, random_seed: 42}
  M4: {batch_size: 4, maximum_epochs: 100, early_stopping_patience_epochs: 15, random_seed: 42}
  M5:
    batch_size: 8
    maximum_epochs: 120
    early_stopping_patience_epochs: 18
    random_seed: 20260530
    historical_internal_label: "M5B"

validation_and_test_use:
  validation:
    - "Learning-rate scheduling"
    - "Early stopping"
    - "Checkpoint selection"
  test:
    - "Final retrospective evaluation"
    - "Split-wise and target-year metric reporting"
  test_not_used_for:
    - "Weight optimization"
    - "Checkpoint selection"
    - "Early stopping"
    - "Learning-rate scheduling"
    - "Hyperparameter tuning"

evaluation:
  metrics: ["RMSE", "MAE", "Bias", "R2", "Valid-pixel count"]
  aggregation: "Sufficient statistics accumulated over all valid pixels in each split or target year"
  reporting_scales:
    - "Normalized LST units"
    - "Degrees Celsius after inverse transformation"

model_comparison:
  M1_to_M4:
    same_spectral_predictor_content: true
    same_target_year_partitions: true
    same_validity_mask_role: true
    same_loss_definition: true
    same_optimizer_family: true
    same_checkpoint_criterion: true
    interpretation: "Controlled comparison of spectral-input architectures."
  M4_to_M5:
    same_predictor_set: false
    same_training_protocol: false
    interpretation: "Comparison between complete experimental configurations, not a pure climate-radiative ablation."

execution_environment:
  primary_environment: "Google Colab-compatible Python environment"
  device_selection: "CUDA GPU when available; CPU fallback"
  external_storage: "Google Drive or adapted local/cloud paths"
  path_adaptation_required: true

notes:
  - "Random patch-level reassignment across temporal splits is not used."
  - "The temporal holdout is not an independent spatial-block validation."
  - "Historical external archive names are retained for traceability."
  - "The notebooks and stored experiment outputs take precedence over this reference YAML if a discrepancy is found."
