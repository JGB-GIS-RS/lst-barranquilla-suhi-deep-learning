# Experiment metadata for the Barranquilla LST/SUHI deep-learning workflow.
# The executed notebooks are authoritative if a discrepancy is found.

experiment:
  name: "barranquilla_landsat_suhi_deep_learning"
  status: "finalized_for_current_repository_scope"
  study_area: "Barranquilla Metropolitan Area, Colombia"
  repository: "https://github.com/JGB-GIS-RS/lst-barranquilla-suhi-deep-learning"
  computational_component: "Retrospective annual LST modeling and evaluation"
  prospective_component_included: false

associated_manuscript:
  title: null
  scope: "Retrospective annual LST modeling and derived SUHI diagnostics for the Barranquilla Metropolitan Area"
  status: "in_preparation"
  target_journal: "Remote Sensing"
  doi: null

spatial_domain:
  name: "Barranquilla Metropolitan Area"
  country: "Colombia"
  landsat_wrs2_path: "009"
  landsat_wrs2_row: "052"
  projected_crs: "EPSG:32618"
  projected_crs_name: "WGS 84 / UTM zone 18N"
  spatial_resolution_m: 30

satellite_data:
  primary_product: "Landsat Collection 2 Level-2 Science Products"
  earth_engine_collections:
    - "LANDSAT/LC08/C02/T1_L2"
    - "LANDSAT/LC09/C02/T1_L2"
  sensors:
    - "Landsat 8 OLI/TIRS"
    - "Landsat 9 OLI-2/TIRS-2"
  temporal_coverage: "2013-2025"
  number_of_scenes: 364
  excluded_years:
    - year: 2026
      reason: "Incomplete annual period and therefore not directly comparable with the completed annual products for 2013-2025."

surface_variables:
  target:
    name: "LST"
    units_before_normalization: "degrees Celsius"
  spectral_predictors:
    - "NDVI"
    - "NDMI"
    - "NDBI"
    - "UI"
    - "SAVI"
    - "BSI"

climate_radiative_data:
  source: "NASA POWER Daily API"
  temporal_coverage: "2013-2025"
  spatial_support: "Point-based annual regional descriptors for the model-domain centroid"
  retained_m5_descriptors:
    - "delta_t2m_mean_Y_minus_Yminus1"
    - "delta_solar_radiation_mean_Y_minus_Yminus1"
  pixel_level_climate_fields: false

temporal_design:
  formulation: "Y-3, Y-2, Y-1 -> LST(Y)"
  operational_years: "2013-2025"
  target_years: "2016-2025"
  target_train_years: [2016, 2017, 2018, 2019]
  target_validation_years: [2020, 2021, 2022]
  target_test_years: [2023, 2024, 2025]
  split_assignment: "By target year before patch extraction"
  independent_spatial_block_holdout: false

normalization:
  landsat_strategy: "Fixed pre-validation reference-period parameter estimation with frozen application to later years"
  landsat_reference_years: [2013, 2014, 2015, 2016, 2017, 2018, 2019]
  lst_method: "Global z-score"
  lst_mean_c: 38.48322677612305
  lst_std_c: 4.032179355621338
  lst_reference_value_count: 4301427
  spectral_method: "Robust percentile-based min-max scaling clipped to [0,1]"
  spectral_p_low: 2
  spectral_p_high: 98
  validation_or_test_used_for_landsat_parameters: false
  climate_descriptor_strategy: "Target-TRAIN-only normalization"
  climate_descriptor_years: [2016, 2017, 2018, 2019]
  historical_label_note: "Historical notebook and directory names retain train_only terminology; for Landsat variables the executed reference experiment used the 2013-2019 pre-validation reference period."

modeling:
  task: "Supervised spatiotemporal regression"
  target_variable: "Annual Landsat-derived LST"
  public_model_sequence:
    - label: "M1"
      name: "U-Net baseline"
      predictors: "18-channel spectral T3 stack"
    - label: "M2"
      name: "SE U-Net"
      predictors: "18-channel spectral T3 stack"
    - label: "M3"
      name: "ConvLSTM U-Net"
      predictors: "Three temporal states with six spectral channels per state"
    - label: "M4"
      name: "ConvLSTM-SE U-Net"
      predictors: "Three temporal states with six spectral channels per state"
    - label: "M5"
      name: "T3-Climate ConvLSTM-SE U-Net"
      predictors: "Spectral T3 sequence plus two regional climate-radiative descriptors"
  final_model_label: "M5"
  historical_internal_labels:
    - "M5B"
  m4_m5_interpretation: "Comparison between complete experimental configurations, not a pure climate ablation."

training_and_evaluation:
  optimizer_family: "AdamW"
  loss_function: "Masked Huber loss"
  checkpoint_selection: "Minimum validation loss"
  validation_uses:
    - "Learning-rate scheduling"
    - "Early stopping"
    - "Checkpoint selection"
  test_uses:
    - "Final retrospective evaluation"
  target_year_lst_used_as_input: false
  antecedent_lst_used_as_input: false
  predictions_or_residuals_used_as_input: false

reproducibility:
  scope: "Methodological inspection, traceability, and partial computational reproduction"
  complete_self_contained_rerun: false
  lightweight_products_included: true
  sample_dataset_included: false
  environment_files:
    - "requirements.txt"
    - "environment.yml"
  configuration_files_are_runtime_authoritative: false
  authoritative_implementation: "Executed notebooks"
  excluded_large_products:
    - "Raw Landsat scenes"
    - "Full-resolution annual GeoTIFF products"
    - "Aligned raster stacks and multi-year cubes"
    - "Tensor datasets"
    - "Patch datasets"
    - "Model checkpoints and trained weights"
    - "Full-resolution prediction and residual maps"
    - "Temporary and intermediate processing products"

authors:
  - name: "Nancy E. Sánchez"
    affiliation:
      - "Universidad Politécnica de Madrid"
      - "Universidad del Quindío"
  - name: "Iñigo Molina Sánchez"
    affiliation:
      - "Universidad Politécnica de Madrid"
  - name: "Julián Garzón Barrero"
    affiliation:
      - "Universidad del Quindío"

notes:
  - "The repository documents the retrospective computational component associated with the current manuscript."
  - "Prospective scenario-based land-cover and LST/SUHI projection components are not included in this repository release."
  - "Some external directories and files retain historical development identifiers such as M5B."
  - "Full-period climate-error tables are descriptive post hoc diagnostics and were not used for checkpoint selection, hyperparameter optimization, or TEST performance tuning."
  - "Large computational products remain outside GitHub by design."
