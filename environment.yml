name: lst-barranquilla-suhi

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Reference Python environment used by the public notebooks.
  - python=3.12

  # Numerical and tabular processing
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # Geospatial processing and external data access
  - rasterio
  - pyproj
  - requests
  - earthengine-api

  # Deep learning
  - pytorch

  # Visualization and table export
  - matplotlib
  - openpyxl

  # Configuration and notebook execution
  - pyyaml
  - ipython
  - jupyter
  - notebook
  - ipykernel
  - pip
