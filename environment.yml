name: lst-barranquilla-suhi

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Reference versions explicitly documented in the manuscript.
  # Other packages are left unpinned because the complete historical environment
  # was not preserved; this YAML defines a compatible environment, not an exact lockfile.
  - python=3.12.13

  # Numerical and tabular processing
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # Geospatial processing and external data access
  - rasterio=1.5.0
  - pyproj
  - requests
  - earthengine-api

  # Deep learning
  - pytorch

  # Visualization and table export
  - matplotlib
  - openpyxl

  # Configuration and notebook execution
  - pyyaml
  - ipython
  - jupyter
  - notebook
  - ipykernel
  - pip
